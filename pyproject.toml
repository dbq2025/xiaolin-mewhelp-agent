[project]
name = "mewhelp"
version = "0.1.0"
description = "MewHelp 电商智能客服"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 沙箱下 TEMP 指向工作区外，pytest 的原子重命名会撞 WinError 5；
# 指到工作区内（已被 .superpowers 的自我忽略规则覆盖）即可
cache_dir = ".superpowers/pytest-cache"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
