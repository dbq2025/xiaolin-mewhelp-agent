; 从仓库根运行 pytest 时的配置。
;
; 为什么需要这一份：代码在 MemHelp-code/ 子目录下（见 agent.md），而从仓库根运行
; pytest 时，pytest 把 rootdir 定在仓库根，**不会读到** MemHelp-code/pyproject.toml
; 里的 [tool.pytest.ini_options] —— 实测后果是 asyncio 退化成 STRICT 模式（而非
; 期望的 AUTO），异步测试整片失败。
;
; 这里的设置刻意与 MemHelp-code/pyproject.toml 保持一致。若要改测试配置，
; **两处都要改**；只在一个位置跑测试会掩盖另一处的配置漂移。
;
; 更稳的日常用法是直接进代码目录跑（配置唯一）：
;   cd MemHelp-code; uv run python -m pytest

[pytest]
testpaths = MemHelp-code/tests
asyncio_mode = auto
pythonpath = MemHelp-code
; 沙箱下 pytest 自建目录会在进程退出后被收回权限，缓存直接关掉；
; 锁定目录的名字也由此不再产生。
addopts = -p no:cacheprovider
