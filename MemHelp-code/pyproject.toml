[project]
name = "mewhelp"
version = "0.1.0"
description = "MewHelp 电商智能客服"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    # 仓库层用 anyio.to_thread.run_sync 把同步的 PyMySQL 调用送进工作线程。
    # 它本是 fastapi 的传递依赖，但**我们直接 import 了它**，所以显式声明 ——
    # 靠传递依赖会在上游改依赖树时静默断掉。
    "anyio>=4.0",
    # -- ch03: RAG / 向量检索 --
    # pymilvus 必须 2.6.x：服务端实测 2.6.22，官方兼容表要求 2.6.X；
    # 3.x 面向 Milvus 3.0，装错会在建集合/搜索时踩到已改签的 API。
    "pymilvus>=2.6,<3",
    # 嵌入走硅基流动的云端 API（上游 DeepSeek 无 /embeddings）。
    # httpx 本来就是传递依赖，但我们直接 import 了它，所以显式声明。
    "httpx>=0.28",
    # ch05：LangGraph 官方 SQLite checkpointer（图状态持久化）。
    # 它是独立官方包，不在 langgraph 主包里；测试注入 InMemorySaver，不落盘。
    "langgraph-checkpoint-sqlite>=3.1.2",
    "mcp>=1.24,<2.0",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "jsonschema>=4.21",
    "langfuse>=5.0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 沙箱注意：pytest 若在工作区内自建临时/缓存目录，进程退出后会被沙箱"去供给"
# 成连列举/删除都被拒的状态（WinError 5），且连 ACL 诊断工具都判定为非权限问题。
# 所以这里一律不在工作区内建：临时文件走沙箱自带的临时区，缓存直接关掉。
addopts = "-p no:cacheprovider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
