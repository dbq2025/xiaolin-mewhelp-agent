<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MewHelp 智能客服</title>
<link rel="stylesheet" href="/chat/style.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="avatar-bot" aria-hidden="true">美</div>
      <div class="brand-text">
        <div class="brand-name">MewHelp 智能客服</div>
        <div class="brand-status" id="status">
          <span class="dot"></span><span id="status-text">正在连接…</span>
        </div>
      </div>
    </div>
    <div class="topbar-actions">
      <label class="toggle" title="显示每轮的上下文裁剪统计">
        <input type="checkbox" id="show-stats">
        <span>统计</span>
      </label>
      <button class="btn-ghost" id="btn-clear" title="清空当前会话">清空</button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar" aria-label="会话列表">
      <div class="sidebar-head">
        <span class="sidebar-title">会话</span>
        <button class="btn-ghost" id="btn-new-chat" type="button">新对话</button>
      </div>
      <ul class="sidebar-list" id="sidebar-list"></ul>
    </aside>

    <main class="messages" id="messages" aria-live="polite"></main>
  </div>

  <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="会话列表">☰</button>

  <footer class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="描述你的问题，比如：我上周买的耳机还没发货"
                autocomplete="off"></textarea>
      <button id="send" class="btn-send" aria-label="发送">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a1 1 0 00-1.39 1.1l1.6 6.05a1 1 0 00.9.75l8.2.5-8.2.5a1 1 0 00-.9.75l-1.6 6.05a1 1 0 001.39 1.1z"/>
        </svg>
      </button>
    </div>
    <div class="composer-hint">Enter 发送 · Shift+Enter 换行</div>
  </footer>
</div>

<script src="/chat/app.js"></script>
</body>
</html>
